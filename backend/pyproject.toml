[project]
name = "fastapi-rag-learn"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "arq>=0.26.0,<1",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "jieba>=0.42.1",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.2",
    "python-multipart>=0.0.29",
    "alembic>=1.18.4",
    "rank-bm25>=0.2.2",
    "redis>=5,<6",
    "sentence-transformers>=5.5.1",
    "uvicorn>=0.48.0",
    "docling>=2.96.0",
    "langchain-qdrant>=1.1.0",
    "qdrant-client>=1.15.1,<1.16",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
per-file-ignores = { "tests/**/*.py" = ["E501"] }

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: lint + type-check + test ──
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.8-alpine3.21
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: citest
          POSTGRES_DB: raglearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raguser -d raglearn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      - name: Create test database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "postgresql://raguser:citest@localhost:5432/raglearn" -c "CREATE DATABASE raglearn_test;" || true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            backend/.venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy app/

      - name: Unit tests (pytest)
        run: uv run pytest tests/ -v
        env:
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes
          DATABASE_URL: postgresql+asyncpg://raguser:citest@localhost:5432/raglearn_test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

  # ── Frontend: lint + type-check + test ──
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (biome)
        run: npx biome check src/

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run

  # ── E2E: Playwright smoke test ──
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.8-alpine3.21
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: citest
          POSTGRES_DB: raglearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raguser -d raglearn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      - name: Cache backend deps
        uses: actions/cache@v4
        with:
          path: |
            backend/.venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen

      - name: Create test database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "postgresql://raguser:citest@localhost:5432/raglearn" -c "CREATE DATABASE raglearn_test;" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head
        env:
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes
          DATABASE_URL: postgresql+asyncpg://raguser:citest@localhost:5432/raglearn_test

      - name: Start backend
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --port 8000 --host 127.0.0.1 > /tmp/backend.log 2>&1 &
          echo "Backend PID: $!"
        env:
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes
          DATABASE_URL: postgresql+asyncpg://raguser:citest@localhost:5432/raglearn_test
          RAG_TEST_MODE: "1"
          OPENAI_API_KEY: test
          OPENAI_BASE_URL: http://127.0.0.1

      - name: Start frontend
        working-directory: frontend
        run: npm run dev -- --port 5173 > /tmp/frontend.log 2>&1 &

      - name: Wait for servers
        run: |
          for i in $(seq 1 90); do
            if curl -s http://127.0.0.1:8000/health > /dev/null 2>&1 && \
               curl -s http://127.0.0.1:5173 > /dev/null 2>&1; then
              echo "Servers ready"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 2
          done
          echo "=== Backend log ==="
          cat /tmp/backend.log
          echo "=== Frontend log ==="
          cat /tmp/frontend.log
          echo "Servers failed to become ready"
          exit 1

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test smoke.spec.ts session.spec.ts --reporter=list --workers=1

# ============================================================
# RAG Learn — Docker 部署（遵循最佳实践）
#
# 启动:  docker compose up --build -d
# 停止:  docker compose down
# 日志:  docker compose logs -f
# ============================================================

services:
  # ── 数据库: PostgreSQL 16 ──
  db:
    image: postgres:16.8-alpine3.21
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: raglearn
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d raglearn"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # ── Redis（消息队列 + 进度追踪）──
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Qdrant 向量数据库 ──
  qdrant:
    image: qdrant/qdrant:v1.14.0
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__TELEMETRY__DISABLED=true
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── ARQ Worker（异步文档处理）──
  worker:
    build: ./backend
    command: uv run arq app.core.worker.WorkerSettings
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://raguser:${DB_PASSWORD:-change-me-in-production}@db:5432/raglearn
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6334
      - SECRET_KEY=${SECRET_KEY:-docker-secret-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── 后端: FastAPI + LangGraph + RAG ──
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_PASSWORD=${DB_PASSWORD:-change-me-in-production}
      - DATABASE_URL=postgresql+asyncpg://raguser:${DB_PASSWORD:-change-me-in-production}@db:5432/raglearn
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6334
      - SECRET_KEY=${SECRET_KEY:-docker-secret-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 512M

  # ── 前端: React + Nginx ──
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M

networks:
  backend:
    driver: bridge
  internal:
    driver: bridge

volumes:
  pgdata:
  qdrant_data:
  redis_data:

# 开发环境用的 docker-compose
# 启动: docker compose up --build
# 后台: docker compose up -d --build
# 停止: docker compose down

services:
  app:
    build: .
    ports:
      - "8000:8000"
    # 从 .env 文件读取 API key 等配置
    env_file:
      - .env
    # 持久化数据（chroma_db 向量库和文档）
    volumes:
      - chroma_data:/app/chroma_db
      - ./documents:/app/documents:ro
    restart: unless-stopped

volumes:
  chroma_data:
